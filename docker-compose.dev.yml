# Dev stack with hot reload. Usage: docker compose -f docker-compose.dev.yml up
# Console: http://localhost:5173 (proxies /api to the server)   API + device gateway: http://localhost:3000
# Mails: http://localhost:8025   Devices connect to ws://localhost:3000/ws/device
name: smartcampus-dev

x-node: &node
  image: node:22-alpine
  working_dir: /app
  volumes:
    - ./:/app
    # Dependencies live in volumes, never on the host checkout.
    - node-modules:/app/node_modules
    - server-node-modules:/app/apps/server/node_modules
    - web-node-modules:/app/apps/web/node_modules
    - protocol-node-modules:/app/packages/protocol/node_modules
    - handshake-node-modules:/app/packages/handshake/node_modules
    - pnpm-store:/root/.local/share/pnpm

services:
  # One-shot: installs dependencies once for the whole workspace.
  install:
    <<: *node
    command: sh -c "corepack enable && pnpm install"

  web:
    <<: *node
    command: sh -c "corepack enable && pnpm --filter @smartcampus/web dev"
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://server:3000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      install:
        condition: service_completed_successfully
      server:
        condition: service_started

  server:
    <<: *node
    command: sh -c "corepack enable && pnpm --filter @smartcampus/server dev"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://mongo:27017/smartcampus
      APP_URL: http://localhost:5173
      SEED_ADMIN_EMAIL: admin@smartcampus.local
      SEED_ADMIN_PASSWORD: changeme123
      AZURE_ENABLED: ${AZURE_ENABLED:-false}
      # Mails (password reset, invitations) land in Mailpit.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      # Gateway identity key. Generated on first start in development, stays out of git.
      SERVER_KEY_FILE: /app/secrets/server-key.pem
      # The protocol test tool enrolls many devices in a row.
      ENROLL_RATE_LIMIT: "1000"
    depends_on:
      install:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"

  mongo:
    image: mongo:8
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-dev-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-dev-data:
  node-modules:
  server-node-modules:
  web-node-modules:
  protocol-node-modules:
  handshake-node-modules:
  pnpm-store:
