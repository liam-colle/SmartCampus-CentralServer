# Production stack. Usage: cp .env.example .env && docker compose up -d --build
services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    secrets:
      - server_key
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/${MONGO_DB:-smartcampus}
      APP_URL: ${APP_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-}
      SERVER_KEY_FILE: /run/secrets/server_key
      ENROLL_REQUEST_TTL_MINUTES: ${ENROLL_REQUEST_TTL_MINUTES:-}
      ENROLL_RATE_LIMIT: ${ENROLL_RATE_LIMIT:-}
      MAX_PENDING_ENROLLMENTS: ${MAX_PENDING_ENROLLMENTS:-}
      AZURE_ENABLED: ${AZURE_ENABLED:-false}
      AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
      AZURE_REDIRECT_URI: ${AZURE_REDIRECT_URI:-}
      AZURE_AUTO_PROVISION: ${AZURE_AUTO_PROVISION:-false}

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

# Gateway identity key (PKCS#8 PEM, ECDSA P-256), kept outside the repo.
# Generate with: pnpm --filter @smartcampus/server keys:generate secrets/server-key.pem
secrets:
  server_key:
    file: ./secrets/server-key.pem

volumes:
  mongo-data:
